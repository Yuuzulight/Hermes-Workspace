<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Creator Artifact</title>
  
  <!-- Hermes Creator Bridge -->
  <script type="module" src="{bridge_path}"></script>
  
  <!-- Artifact-specific scripts will be injected here by renderer -->
</head>
<body class="min-h-screen bg-white">
  <div id="artifact-root"></div>
  
  <!-- PostMessage bridge for Hermes agent communication -->
  <script>
    (function() {
      // Expose artifact context to Hermes runtime
      window.HermesArtifactContext = {
        identifier: "{identifier}",
        type: "{type}",
        version: "1.0",
        
        sendToHermes(type, payload) {
          if (!window.parent || !window.parent.HermesCreatorBridge) return;
          
          window.parent.postMessage({
            __hermes_creator__: true,
            identifier: "{identifier}",
            type,
            payload,
          }, "*");
        },
        
        onHermesMessage(handler) {
          if (!window.parent || !window.parent.HermesCreatorBridge) return;
          
          const unsubscribe = window.parent.HermesCreatorBridge.on("artifact:" + type, handler);
          return unsubscribe;
        },
      };
    })();
  </script>
</body>
</html>
